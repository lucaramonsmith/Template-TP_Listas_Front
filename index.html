<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <form id=agregarComidaForm>
        <h2>Agregar comida</h2>
        <label for="nombre">Comida</label>
        <input type="text" id="nombre" placeholder="Nombre de la comida" requiered>

        <label for="provincia">Provincia</label>
        <input type="text" id="provincia" placeholder="Provincia de la comida" requiered>

        <label for="categoria">Categoría</label>
        <input type="text" id="categoria" placeholder="Categoría de la comida" requiered>

        <label for="ingredientes">Ingredientes</label>
        <input type="text" id="ingredientes" placeholder="Ingredientes de la comida" requiered>
        
        
        
        
        
        
        <button type="submit">Agregar</button>



      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
